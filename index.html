<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> The Island </title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#0a1a63;--ink:#eaf0ff;--panel:#04060c;--accent:#3d6bff;--muted:#8c9acb;--line:#2a3a8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:24px 24px 0;display:flex}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.8rem;letter-spacing:-.04em}
.logo svg{width:36px;height:36px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;width:100%;margin:0 auto;padding:24px}
h1{font-size:clamp(1.8rem,6vw,3.2rem);line-height:1;letter-spacing:-.04em;font-weight:800;margin:0 0 24px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,16px)}
.unit{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:clamp(14px,4vw,32px) 6px;text-align:center}
.num{display:block;font-size:clamp(2rem,10vw,5.5rem);font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.name{display:block;margin-top:8px;font-size:clamp(.75rem,2.5vw,1rem);color:var(--muted);font-weight:600}
.unit.s .num{color:var(--accent)}
.when{margin:24px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;color:var(--muted);font-weight:600}
.when input{font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;color-scheme:dark}
.when input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.done .clock{opacity:.35}
@media (max-height:480px){header{padding-top:12px}main{padding:12px 24px}h1{margin-bottom:12px}.when{margin-top:12px}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-label="Miramar">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#04060c"/><path d="M9 33c4-6 9-8 15-8s11 2 15 8z" fill="#3d6bff"/><path d="M24 26c0-5 1-9 3-12M27 14c-3-4-7-4-10-2 3 0 6 1 8 3M27 14c3-4 7-4 10-2-3 0-6 1-8 3M9 39q4-3 8 0t8 0 8 0 6 0" fill="none" stroke="#eaf0ff" stroke-width="2" stroke-linecap="round"/></svg>
    Miramar Maddness 
  </div>
</header>
<main id="app">
  <h1 id="title"></h1>
  <div class="clock" role="timer" aria-label="Time until Island opens">
    <div class="unit"><span class="num" id="d">00</span><span class="name">days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="name">hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="name">minutes</span></div>
    <div class="unit s"><span class="num" id="s">00</span><span class="name">seconds</span></div>
  </div>
  <div class="when">
    <span id="label"></span>
    
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const target=new Date(2026,11,12,0,0,0);
function label(){
  $('label').textContent=target.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function tick(){
  let t=Math.max(0,Math.floor((target-Date.now())/1000));
  $('d').textContent=pad(Math.floor(t/86400));
  $('h').textContent=pad(Math.floor(t%86400/3600));
  $('m').textContent=pad(Math.floor(t%3600/60));
  $('s').textContent=pad(t%60);
  const over=t===0;
  document.body.classList.toggle('done',over);
  $('title').textContent=over?'Island is open.':'';
}
label();tick();setInterval(tick,1000);
</script>
</body>
</html>
