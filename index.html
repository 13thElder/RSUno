<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .music-player {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .album-cover {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            margin-bottom: 30px;
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .song-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .artist-name {
            font-size: 18px;
            opacity: 0.7;
        }
        
        .audio-container {
            width: 100%;
            margin-bottom: 20px;
        }
        
        audio {
            width: 100%;
            outline: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }
        
        .progress-container {
            width: 100%;
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background-color: white;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            flex-grow: 1;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .volume-level {
            height: 100%;
            background-color: white;
            width: 70%;
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MUSIC PLAYER</h1>
        
        <div class="music-player">
            <div class="album-cover">
                <img src="https://sb.untitled.stream/storage/v1/object/sign/private-project-art/ab184ee1-7e1d-4f65-a690-6b3ff42cda78/be09ab64c5f623298b4ae28e653ab2c4a495ea37.jpeg?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmwiOiJwcml2YXRlLXByb2plY3QtYXJ0L2FiMTg0ZWUxLTdlMWQtNGY2NS1hNjkwLTZiM2ZmNDJjZGE3OC9iZTA5YWI2NGM1ZjYyMzI5OGI0YWUyOGU2NTNhYjJjNGE0OTVlYTM3LmpwZWciLCJpYXQiOjE3ODkxNTExNjAsImV4cCI6MTc5OTUxOTE2MH0.HpRQ7Mm9q6iCo_eGHSEd5vtQ3bhFBknM-ZZnlcFcq3c" alt="Album Cover">
            </div>
            
            <div class="song-info">
                <div class="song-title">SOLO</div>
                <div class="artist-name">SSGManny</div>
            </div>
            
            <div class="audio-container">
                <audio id="audio-player" src="https://sb.untitled.stream/storage/v1/object/sign/private-transcoded-audio/ab184ee1-7e1d-4f65-a690-6b3ff42cda78/KJSaPgljLDjR38KfNAZeg.mp3?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmwiOiJwcml2YXRlLXRyYW5zY29kZWQtYXVkaW8vYWIxODRlZTEtN2UxZC00ZjY1LWE2OTAtNmIzZmY0MmNkYTc4L0tKU2FQZ2xqTERqUjM4S2ZOQVplZy5tcDMiLCJpYXQiOjE3ODkxNTExNzksImV4cCI6MTc4OTE2MTk3OX0.1iKBIrG38ndBgUYxH-bbzPADtYvI44xKDBzia9EsUng"></audio>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn" id="prev-btn">⏮</button>
                <button class="btn play-pause" id="play-pause-btn">▶</button>
                <button class="btn" id="next-btn">⏭</button>
            </div>
            
            <div class="volume-container">
                <span>🔊</span>
                <div class="volume-slider" id="volume-slider">
                    <div class="volume-level" id="volume-level"></div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2026 Music Player. All rights reserved.</p>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audioPlayer = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const progressBar = document.getElementById('progress-bar');
            const progress = document.getElementById('progress');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const volumeSlider = document.getElementById('volume-slider');
            const volumeLevel = document.getElementById('volume-level');
            
            // Play/Pause functionality
            playPauseBtn.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    playPauseBtn.textContent = '⏸';
                } else {
                    audioPlayer.pause();
                    playPauseBtn.textContent = '▶';
                }
            });
            
            // Update progress bar
            audioPlayer.addEventListener('timeupdate', function() {
                const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progress.style.width = percentage + '%';
                
                // Update time display
                const currentMinutes = Math.floor(audioPlayer.currentTime / 60);
                const currentSeconds = Math.floor(audioPlayer.currentTime % 60).toString().padStart(2, '0');
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds}`;
            });
            
            // Set duration when metadata is loaded
            audioPlayer.addEventListener('loadedmetadata', function() {
                const durationMinutes = Math.floor(audioPlayer.duration / 60);
                const durationSeconds = Math.floor(audioPlayer.duration % 60).toString().padStart(2, '0');
                durationEl.textContent = `${durationMinutes}:${durationSeconds}`;
            });
            
            // Click on progress bar to seek
            progressBar.addEventListener('click', function(e) {
                const clickPosition = e.offsetX / progressBar.offsetWidth;
                audioPlayer.currentTime = clickPosition * audioPlayer.duration;
            });
            
            // Volume control
            volumeSlider.addEventListener('click', function(e) {
                const clickPosition = e.offsetX / volumeSlider.offsetWidth;
                audioPlayer.volume = clickPosition;
                volumeLevel.style.width = (clickPosition * 100) + '%';
            });
            
            // Set initial volume
            audioPlayer.volume = 0.7;
            volumeLevel.style.width = '70%';
        });
    </script>
</body>
</html>
